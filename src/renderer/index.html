<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' game: data: blob:; style-src 'self' 'unsafe-inline'">
<title>Dracula</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  #box { position: relative; z-index: 1; background: #000; width: 100vw; height: 100vh; }
  /* the F3 toggle eases between 4:3 and stretched (LAYOUT_EASE_MS in engine.ts) */
  #box.easing { transition: width .45s cubic-bezier(.22,.7,.26,1), height .45s cubic-bezier(.22,.7,.26,1); }
  /* 4:3 mode: the bars show the current frame, blurred and dark (backdrop.ts).
     Scaled up a little so the blur never fades to black at the window edges. */
  #backdrop { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0;
              filter: blur(30px) brightness(.62) saturate(1.3); transform: scale(1.12);
              transition: opacity .45s ease, visibility 0s; }
  /* fades out with the stretch easing, then stops painting altogether */
  #backdrop.off { opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility 0s .45s; }
  #box canvas, #box video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #box canvas { display: block; }
  #overlay { image-rendering: pixelated; cursor: none; }
  #movie { background: #000; object-fit: contain; display: none; }
  #ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #d8c9a3; background: rgba(0,0,0,.82); text-align: center; padding: 24px; box-sizing: border-box; }
  #ui h1 { font-family: Georgia, serif; font-weight: normal; letter-spacing: .08em; margin: 0 0 18px; font-size: 32px; }
  #ui p { max-width: 600px; line-height: 1.5; margin: 6px 0; font-size: 14px; color: #bfb39a; }
  #ui p.small { font-size: 12px; color: #9c917c; }
  #ui button { margin-top: 18px; background: #5a1414; color: #f1e3c2; border: 1px solid #8a3b2b; padding: 10px 26px;
               font-size: 16px; cursor: pointer; }
  #ui button:hover, #ui button:focus-visible { background: #761d1d; outline: none; }
  #ui .row { display: flex; gap: 12px; }

  /* ---- start screen: the two covers split the window, full bleed ------- */
  #ui.pick-game { padding: 0; background: #000; }
  #ui .games { display: flex; width: 100%; height: 100%; }
  #ui .game { position: relative; flex: 1 1 0; min-width: 0; overflow: hidden; cursor: pointer; outline: none;
              transition: flex-grow .55s cubic-bezier(.22,.7,.26,1); }
  #ui .game + .game { border-left: 1px solid #1c1512; }
  #ui .game img { position: absolute; inset: 0; width: 100%; height: 100%; }
  /* contain, never cover: the box art is shown whole, never cropped */
  #ui .game img.art { object-fit: contain; filter: grayscale(.5) brightness(.72) contrast(1.02);
                      transition: filter .55s cubic-bezier(.22,.7,.26,1); }
  /* animate opacity only: animating a blur is costly */
  #ui .game img.blur { object-fit: cover; transform: scale(1.15); filter: blur(36px) brightness(.62) saturate(1.3);
                       opacity: .75; transition: opacity .55s cubic-bezier(.22,.7,.26,1); }
  #ui .game .edge { position: absolute; inset: 0; z-index: 1; pointer-events: none;
                    box-shadow: inset 0 0 0 0 rgba(138,59,43,0); transition: box-shadow .55s cubic-bezier(.22,.7,.26,1); }
  /* a soft fade keeps the caption readable where the art reaches the bottom */
  #ui .caption { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 70px 24px 44px;
                 text-align: center; pointer-events: none;
                 background: linear-gradient(to top, rgba(0,0,0,.88), rgba(0,0,0,.55) 45%, rgba(0,0,0,0)); }
  #ui .caption .name { font-family: Georgia, serif; font-size: 25px; letter-spacing: .05em; color: #bfb39a;
                       transition: color .55s cubic-bezier(.22,.7,.26,1); }
  #ui .caption .go { margin-top: 9px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase;
                     color: #c2714f; opacity: 0; transform: translateY(8px);
                     transition: opacity .55s cubic-bezier(.22,.7,.26,1), transform .55s cubic-bezier(.22,.7,.26,1); }
  #ui .games.picking .game.sel { flex-grow: 1.45; }
  #ui .games.picking .game:not(.sel) { flex-grow: .75; }
  #ui .game.sel img.art { filter: none; }
  #ui .game.sel img.blur { opacity: 1; }
  #ui .games.picking .game:not(.sel) img.art { filter: grayscale(1) brightness(.3); }
  #ui .games.picking .game:not(.sel) img.blur { opacity: .3; }
  #ui .game.sel .edge { box-shadow: inset 0 0 0 2px rgba(138,59,43,.75), inset 0 0 90px rgba(120,20,15,.4); }
  #ui .game.sel .caption .name { color: #e8d9b4; }
  #ui .game.sel .caption .go { opacity: 1; transform: none; }

  #ui .game.unset { cursor: default; }
  #ui .game.unset img.art { filter: grayscale(1) brightness(.16) !important; }
  #ui .game.unset img.blur { opacity: .12 !important; }
  #ui .game.unset .caption .name { color: #6d6457; }
  #ui .game.unset .caption .go { visibility: hidden; }   /* keeps both captions on one baseline */


  #ui .corner { position: absolute; top: 14px; right: 14px; z-index: 5; display: flex; gap: 8px; }
  #ui .corner button { display: flex; align-items: center; gap: 0; margin: 0; padding: 8px 12px; line-height: 1;
                       background: rgba(10,7,6,.6); border: 1px solid rgba(138,59,43,.4); border-radius: 20px;
                       color: #cfc1a2; cursor: pointer;
                       transition: gap .3s ease, color .3s ease, background .3s ease, border-color .3s ease; }
  #ui .corner .glyph { display: inline-block; transition: transform .4s ease; }
  #ui button.gear .glyph { font-size: 19px; }
  #ui button.quit .glyph { font-size: 15px; }
  #ui .corner .label { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; font-size: 12px;
                       letter-spacing: .08em; transition: max-width .35s ease, opacity .3s ease; }
  #ui .corner button:hover, #ui .corner button:focus-visible {
    gap: 8px; color: #f1e3c2; background: rgba(40,14,12,.8); border-color: rgba(194,113,79,.75); outline: none; }
  #ui .corner button:hover .label, #ui .corner button:focus-visible .label { max-width: 140px; opacity: 1; }
  #ui button.gear:hover .glyph, #ui button.gear:focus-visible .glyph { transform: rotate(45deg); }
  #ui button.quit:hover, #ui button.quit:focus-visible { color: #e07a62; }
  #ui.nothing button.gear { gap: 8px; color: #f1e3c2; background: rgba(90,20,20,.8); border-color: #c2714f; }
  #ui.nothing button.gear .label { max-width: 140px; opacity: 1; }

  #ui .update { position: absolute; top: 14px; left: 14px; z-index: 5; display: flex; align-items: center; gap: 12px;
                padding: 5px 5px 5px 14px; text-align: left; background: rgba(10,7,6,.6);
                border: 1px solid rgba(138,59,43,.4); border-radius: 20px; animation: fade-in .6s ease; }
  #ui .update[hidden] { display: none; }
  #ui .update .version { display: block; font-size: 12px; letter-spacing: .04em; color: #cfc1a2; }
  #ui .update .why { display: block; margin-top: 2px; font-size: 11px; color: #9c917c; }
  #ui .update .why:empty { display: none; }
  #ui .update button { margin: 0; padding: 6px 14px; font-size: 12px; border-radius: 15px; }
  @keyframes fade-in { from { opacity: 0; } }

  /* ---- settings sheet -------------------------------------------------- */
  #ui .scrim { position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,.72);
               display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  #ui .sheet { width: 520px; max-width: 100%; max-height: 100%; overflow-y: auto; box-sizing: border-box; text-align: left;
               background: #120d0c; border: 1px solid #4a3127; padding: 26px 28px 22px;
               box-shadow: 0 24px 70px rgba(0,0,0,.85); }
  #ui .sheet h2 { font-family: Georgia, serif; font-weight: normal; font-size: 21px; letter-spacing: .06em;
                  margin: 0 0 10px; color: #e8d9b4; }
  #ui .sheet p.lead { margin: 0 0 18px; font-size: 12.5px; line-height: 1.6; color: #9c917c; max-width: none; }
  #ui .sheet .where { background: #0a0706; border: 1px solid #2e211c; padding: 10px 12px; margin-bottom: 16px; }
  #ui .sheet .path { font-family: ui-monospace, monospace; font-size: 11.5px; color: #bfb39a; word-break: break-all; }
  #ui .sheet ul.found { list-style: none; margin: 0 0 12px; padding: 0; }
  #ui .sheet .row.pick-row { justify-content: flex-start; margin-bottom: 22px; }
  #ui .sheet ul.found li { display: flex; gap: 10px; align-items: baseline; padding: 7px 0;
                           border-top: 1px solid #241a16; font-size: 13px; }
  #ui .sheet ul.found li .mark { width: 14px; flex: none; text-align: center; font-size: 12px; }
  #ui .sheet ul.found li .gname { white-space: nowrap; flex: none; }
  #ui .sheet ul.found li .gwhere { flex: 1; min-width: 0; text-align: right; overflow-wrap: anywhere; }
  #ui .sheet ul.found li.ok .mark { color: #7fa36a; }
  #ui .sheet ul.found li.no .mark { color: #8a4b3b; }
  #ui .sheet ul.found li .gname { color: #d8c9a3; }
  #ui .sheet ul.found li .gwhere { color: #8f8573; font-size: 11.5px; }
  #ui .sheet ul.found li button.remove { flex: none; align-self: center; padding: 3px 10px; font-size: 11.5px; }
  #ui .sheet .row { justify-content: flex-end; }
  #ui .sheet .row.pick-row { gap: 10px; }
  #ui .sheet.import { width: 600px; }
  #ui .sheet .pickline { display: flex; gap: 8px; align-items: stretch; }
  #ui .sheet .pickline .where { flex: 1; min-width: 0; margin: 0; }
  #ui .sheet .pickline button { padding: 6px 14px; font-size: 13px; }
  #ui .sheet p.note { margin: 6px 0 16px; min-height: 1em; font-size: 11.5px; color: #8f8573; }
  #ui .sheet p.note.ok { color: #7fa36a; }
  #ui .sheet p.note.bad { color: #c2714f; }
  #ui .sheet .progress { margin: 4px 0 16px; }
  #ui .sheet .progress .stage { display: flex; justify-content: space-between; font-size: 12.5px; color: #d8c9a3; margin-bottom: 8px; }
  #ui .sheet .progress .count { color: #9c917c; font-variant-numeric: tabular-nums; }
  #ui .sheet .progress .bar { height: 6px; background: #0a0706; border: 1px solid #2e211c; }
  #ui .sheet .progress .bar > div { height: 100%; width: 0; background: #8a3b2b; transition: width .3s ease; }
  #ui .sheet p.msg { margin: 0 0 16px; font-size: 12.5px; line-height: 1.5; color: #d8c9a3; }
  #ui .sheet p.msg:empty { display: none; }
  #ui .sheet button:disabled { opacity: .45; cursor: default; }
  #ui .sheet button { margin: 0; padding: 9px 20px; font-size: 14px; }
  #ui button.sec { background: transparent; border-color: #6a4a3a; color: #d8c9a3; }
  #ui button.sec:hover { background: rgba(120,40,30,.35); }

  #ui.menu { background: rgba(0,0,0,.55); }
  #ui .sheet .opts { margin: 6px 0 20px; }
  #ui .sheet .opt { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid #241a16;
                    font-size: 13px; color: #d8c9a3; cursor: pointer; }
  #ui .sheet .opt > span { flex: 1; }
  #ui .sheet .opt input { margin: 0; accent-color: #8a3b2b; cursor: pointer; }
  #ui .sheet .opt input:focus-visible { outline: 1px solid #c2714f; outline-offset: 3px; }
  #ui .sheet .opt input[type=range] { flex: 0 0 150px; min-width: 0; }
  #ui .sheet .opt output { width: 46px; text-align: right; font-size: 12px; color: #9c917c;
                           font-variant-numeric: tabular-nums; }
  #ui .sheet .seg { display: flex; border: 1px solid #3a2a22; }
  #ui .sheet .seg label { cursor: pointer; }
  #ui .sheet .seg input { position: absolute; opacity: 0; pointer-events: none; }
  #ui .sheet .seg span { display: block; padding: 4px 11px; font-size: 12px; color: #9c917c; }
  #ui .sheet .seg label:hover span { color: #d8c9a3; }
  #ui .sheet .seg input:checked + span { background: #5a1414; color: #f1e3c2; }
  #ui .sheet .seg input:focus-visible + span { outline: 1px solid #c2714f; outline-offset: -1px; }
  #ui .sheet kbd { font-family: ui-monospace, monospace; font-size: 11px; color: #9c917c;
                   border: 1px solid #3a2a22; padding: 1px 6px; }
  #ui .sheet .row { align-items: center; }
  #ui .sheet .hint { flex: 1; font-size: 11.5px; color: #6d6457; }
  #ui .sheet.options { width: 900px; }
  #ui .sheet .cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 36px; }
  #ui .sheet h3 { font-family: Georgia, serif; font-weight: normal; font-size: 13px; letter-spacing: .1em;
                  text-transform: uppercase; color: #9c917c; margin: 6px 0 4px; }
  #ui .sheet .keys { display: grid; grid-template-columns: 1fr auto; column-gap: 16px; margin: 0 0 20px;
                     font-size: 13px; color: #d8c9a3; }
  #ui .sheet .keys > span { display: flex; gap: 4px; align-items: center; padding: 8px 0;
                            border-top: 1px solid #241a16; }
  @media (max-width: 860px) { #ui .sheet .cols { grid-template-columns: 1fr; } }
  #msg { position: absolute; left: 8px; bottom: 8px; color: #e6d7b0; font-size: 12px; background: rgba(0,0,0,.6);
         padding: 3px 8px; pointer-events: none; display: none; }
</style>
</head>
<body>
<canvas id="backdrop" class="off"></canvas>
<div id="box">
  <canvas id="gl"></canvas>
  <canvas id="screen2d" width="640" height="480"></canvas>
  <canvas id="overlay" width="640" height="480"></canvas>
  <video id="movie" playsinline></video>
  <div id="msg"></div>
  <div id="ui">
    <h1>DRACULA</h1>
    <p>Carregando…</p>
  </div>
</div>

<!-- Markup for the screens built at runtime. app.ts / engine.ts clone these and fill
     them with textContent, so no HTML is ever concatenated in TypeScript. -->
<template id="tpl-start">
  <div class="games"></div>
  <div class="corner">
    <button class="gear" aria-label="Settings"><span class="glyph">⚙</span><span class="label">Settings</span></button>
    <button class="quit" aria-label="Quit"><span class="glyph">✕</span><span class="label">Quit</span></button>
  </div>
  <div class="update" role="status" hidden>
    <span><span class="version"></span><span class="why"></span></span>
    <button class="get">Download</button>
  </div>
</template>

<template id="tpl-game">
  <div class="game" role="button" tabindex="0">
    <img class="blur" alt="">
    <img class="art" alt="">
    <div class="edge"></div>
    <div class="caption">
      <div class="name"></div>
      <div class="go">Play</div>
    </div>
  </div>
</template>

<template id="tpl-settings">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Settings">
    <h2>Settings</h2>
    <h3>Game data</h3>
    <p class="lead">One folder holding both games. Each game is detected on its own,
      so a folder with only one of them works too.</p>
    <div class="where"><span class="path"></span></div>
    <ul class="found"></ul>
    <div class="row pick-row">
      <button class="pick" data-choose>Choose folder…</button>
      <button class="sec import" data-import>Import from game files…</button>
    </div>
    <h3>Play</h3>
    <div class="opts"></div>
    <h3>Updates</h3>
    <div class="opts">
      <label class="opt"><input type="checkbox" name="updateCheck"><span>Check for a new version at launch</span></label>
    </div>
    <div class="row">
      <span class="hint">Dracula Engine <span data-version></span></span>
      <button class="sec close">Close</button>
    </div>
  </div>
</template>

<template id="tpl-prefs">
  <label class="opt"><span>Volume</span>
    <input type="range" name="volume" min="0" max="100" step="1"><output></output></label>
  <div class="opt"><span>Mouse</span>
    <div class="seg"><label><input type="radio" name="classic" value="1"><span>Original</span></label><label><input type="radio" name="classic" value="0"><span>Free cursor</span></label></div></div>
  <label class="opt"><span>Look speed</span>
    <input type="range" name="sensitivity" min="25" max="300" step="5"><output></output></label>
  <div class="opt"><span>Aspect ratio</span>
    <div class="seg"><label><input type="radio" name="stretch" value="0"><span>Original 4:3</span></label><label><input type="radio" name="stretch" value="1"><span>Fill screen</span></label></div></div>
  <label class="opt"><input type="checkbox" name="skipIntro"><span>Skip the intro and start at the menu</span></label>
</template>

<template id="tpl-options">
  <div class="sheet options" role="dialog" aria-modal="true" aria-label="Options">
    <h2>Options</h2>
    <div class="cols">
    <div>
    <h3>Settings</h3>
    <div class="opts">
      <label class="opt"><input type="checkbox" name="fullscreen"><span>Fullscreen</span></label>
    </div>
    </div>
    <div>
    <h3>Controls</h3>
    <div class="keys">
      <span>Look around</span><span><kbd>Mouse</kbd><kbd>Arrows</kbd></span>
      <span>Act</span><span><kbd>Left click</kbd></span>
      <span>Inventory</span><span><kbd>Right click</kbd><kbd>Tab</kbd></span>
      <span>Game menu</span><span><kbd>Esc</kbd></span>
      <span>Skip video</span><span><kbd>Space</kbd><kbd>Esc</kbd></span>
      <span>Mouse mode</span><span><kbd>F2</kbd></span>
      <span>Aspect ratio</span><span><kbd>F3</kbd></span>
      <span>Options</span><span><kbd>F10</kbd></span>
      <span>Fullscreen</span><span><kbd>F11</kbd></span>
    </div>
    </div>
    </div>
    <div class="row">
      <span class="hint">F10 or Esc to resume</span>
      <button class="resume">Resume</button>
    </div>
  </div>
</template>

<template id="tpl-import">
  <div class="sheet import" role="dialog" aria-modal="true" aria-label="Import a game">
    <h2>Import a game</h2>
    <p class="lead">Point to an installed copy of Dracula: The Resurrection or Dracula 2 (the GOG
      version, for example), to a folder with their CD images (.img, .bin or .iso), or to a
      folder holding both games, which are then imported one after the other. Each is converted
      once into a new folder the app plays from; the original files are never changed. This
      takes a while, mostly for the movies.</p>
    <div class="form">
      <h3>Game files</h3>
      <div class="pickline"><div class="where"><span class="path" data-path="game"></span></div>
        <button class="sec" data-pick="game">Choose…</button></div>
      <p class="note" data-note="game"></p>
      <h3>Save to</h3>
      <div class="pickline"><div class="where"><span class="path" data-path="dest"></span></div>
        <button class="sec" data-pick="dest">Choose…</button></div>
      <p class="note" data-note="dest"></p>
    </div>
    <div class="progress" hidden>
      <div class="stage"><span class="label"></span><span class="count"></span></div>
      <div class="bar"><div></div></div>
    </div>
    <p class="msg"></p>
    <div class="row">
      <button class="start">Import</button>
      <button class="sec stop" hidden>Stop</button>
      <button class="sec close">Close</button>
    </div>
  </div>
</template>

<template id="tpl-loading">
  <h1></h1>
  <p>Loading…</p>
</template>

<script src="app.js"></script>
</body>
</html>
